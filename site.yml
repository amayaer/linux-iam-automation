- name: Provision users and groups
  hosts: all
  become: true

  tasks:
    - name: Read existing accounts
      ansible.builtin.getent:
        database: passwd

    - name: Ensure groups exist
      ansible.builtin.group:
        name: "{{ item.name }}"
        state: present
      loop: "{{ system_groups }}"

    - name: Ensure users exist and are assigned to groups
      ansible.builtin.user:
        name: "{{ item.name }}"
        comment: "{{ item.comment | default(omit) }}"
        groups: "{{ item.secondary_groups }}"
        append: true
        update_password: on_create
        expires: "{{ item.expires | default(omit) }}"
        password_expire_max: "{{ item.password_expire_max | default(omit) }}"
        password: "{{ lookup('password', password_dir ~ '/temp-passwords/' ~ item.name ~ '_password length=20 chars=ascii_letters,digits') | password_hash('sha512', rounds=100000) }}"
        state: present
      loop: "{{ system_users }}"

    - name: Require new users to change password at first login
      ansible.builtin.command: 
        cmd: "/usr/bin/chage -d 0 {{ item.name }}"
      loop: "{{ system_users }}"
      when: item.name not in ansible_facts.getent_passwd
      changed_when: true

    - name: Ensure service accounts exist
      ansible.builtin.user:
        name: "{{ item.name }}"
        shell: "{{ item.shell }}"
        system: "{{ item.system }}"
        create_home: "{{ item.create_home }}"
      loop: "{{ service_accounts }}"

    - name: Grant the admins group full sudo access
      ansible.builtin.copy: 
        dest: /etc/sudoers.d/admins
        content: "%admins ALL=(ALL) ALL\n"
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    - name: Allow helpdesk to run account-support commands
      ansible.builtin.template: 
        src: helpdesk_sudoers.j2
        dest: /etc/sudoers.d/helpdesk
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    - name: Allow deployers to restart approved services
      ansible.builtin.copy: 
        dest: /etc/sudoers.d/deployers
        content: |
          %deployers ALL=/usr/bin/systemctl restart chronyd.service
          %deployers ALL=/usr/bin/systemctl restart bluetooth.service
          %deployers ALL=/usr/bin/systemctl restart cups.service
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    - name: Set audit log group to auditors
      ansible.builtin.lineinfile: 
        path: /etc/audit/auditd.conf
        regexp: '^log_group\s*='
        line: 'log_group = auditors'
      notify: Restart auditd

  handlers: 
    - name: Restart auditd
      ansible.builtin.command:
        cmd: /usr/sbin/service auditd restart


  